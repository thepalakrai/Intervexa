function LoginScreen({ onAuthenticated }) {
  const [mode, setMode] = useState("login"); // login | signup
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [showPassword, setShowPassword] = useState(false);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  async function handleSubmit() {
    if (!email.trim() || !password.trim() || (mode === "signup" && !name.trim())) {
      setError("Please fill in all fields.");
      return;
    }
    setLoading(true);
    setError("");
    try {
      const endpoint = mode === "signup" ? "/signup" : "/login";
      const body = mode === "signup" ? { name, email, password } : { email, password };
      const res = await fetch(`${API}${endpoint}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Something went wrong.");

      localStorage.setItem("intervexa_token", data.token);
      localStorage.setItem("intervexa_name", data.name);
      onAuthenticated({ name: data.name, email: data.email, token: data.token });
    } catch (e) {
      setError(e.message === "Failed to fetch"
        ? "Cannot reach the server. Start the backend first: open a terminal in virexa-backend and run “python main.py”, then try again."
        : e.message || "Something went wrong.");
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="auth-wrap">
      <div className="card auth-card">
        <div className="brand" style={{ marginBottom: 18 }}><span className="brand-mark">Ix</span>Intervexa</div>
        <h2 className="auth-title">{mode === "login" ? "Welcome back" : "Create your account"}</h2>
        <p className="card-sub">{mode === "login" ? "Log in to continue practicing." : "One account for interviews and curation."}</p>
        <ErrorBox message={error} />

        <div className="segmented" role="tablist">
          <button className={mode === "login" ? "active" : ""} onClick={() => { setMode("login"); setError(""); }}>Log in</button>
          <button className={mode === "signup" ? "active" : ""} onClick={() => { setMode("signup"); setError(""); }}>Sign up</button>
        </div>

        {mode === "signup" && (
          <div className="field">
            <label>Name</label>
            <input type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder="Your full name" autoComplete="name" />
          </div>
        )}
        <div className="field">
          <label>Email</label>
          <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@example.com" autoComplete="email" />
        </div>
        <div className="field">
          <label>Password</label>
          <div className="input-with-toggle">
            <input type={showPassword ? "text" : "password"} value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••••" autoComplete={mode === "login" ? "current-password" : "new-password"} />
            <button type="button" className="toggle-vis" onClick={() => setShowPassword(!showPassword)} title={showPassword ? "Hide password" : "Show password"}>
              <Icon name={showPassword ? "eyeOff" : "eye"} size={15} />
            </button>
          </div>
        </div>

        <button className="btn primary block" onClick={handleSubmit} disabled={loading}>
          {loading ? <React.Fragment><Spinner /> Please wait…</React.Fragment> : mode === "login" ? "Log in" : "Create account"}
        </button>
      </div>
    </div>
  );
}

function AdminScreen({ onBack }) {
  const token = localStorage.getItem("intervexa_token");
  const [meta, setMeta] = useState({ topics: [], domains: [], statuses: [] });
  const [items, setItems] = useState([]);
  const [total, setTotal] = useState(0);
  const [filters, setFilters] = useState({ topic: "", status: "", q: "" });
  const [error, setError] = useState("");
  const [notice, setNotice] = useState("");
  const [loading, setLoading] = useState(false);
  // create form
  const [form, setForm] = useState({ topic: "", difficulty: 2, text: "", expected_concepts: "", domain: "" });
  // generate form
  const [gen, setGen] = useState({ domain: "", topic: "", difficulty: 2, count: 5, context: "" });

  const headers = { "Content-Type": "application/json", "Authorization": `Bearer ${token}` };

  async function loadMeta() {
    try {
      const res = await fetch(`${API}/admin/questions/topics`, { headers: { "Authorization": `Bearer ${token}` } });
      if (res.ok) setMeta(await res.json());
    } catch (e) {}
  }

  async function loadList() {
    setLoading(true);
    setError("");
    try {
      const params = new URLSearchParams({ limit: 50, offset: 0 });
      if (filters.topic) params.set("topic", filters.topic);
      if (filters.status) params.set("status", filters.status);
      if (filters.q) params.set("q", filters.q);
      const res = await fetch(`${API}/admin/questions?${params}`, { headers: { "Authorization": `Bearer ${token}` } });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Could not load questions.");
      setItems(data.items);
      setTotal(data.total);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }

  useEffect(() => { loadMeta(); loadList(); }, []);

  async function handleCreate() {
    setError(""); setNotice("");
    try {
      const body = {
        topic: form.topic,
        difficulty: Number(form.difficulty),
        text: form.text,
        expected_concepts: form.expected_concepts.split(",").map((s) => s.trim()).filter(Boolean),
        domain: form.domain || null,
        status: "pending_review",
      };
      const res = await fetch(`${API}/admin/questions`, { method: "POST", headers, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Create failed.");
      setNotice(`Created ${data.id} as pending_review.`);
      setForm({ topic: "", difficulty: 2, text: "", expected_concepts: "", domain: "" });
      loadList();
    } catch (e) {
      setError(e.message);
    }
  }

  async function handleGenerate() {
    setError(""); setNotice("");
    try {
      const body = {
        domain: gen.domain || null,
        topic: gen.topic || null,
        difficulty: Number(gen.difficulty),
        count: Number(gen.count),
        context: gen.context || null,
      };
      const res = await fetch(`${API}/admin/questions/generate`, { method: "POST", headers, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Generation failed.");
      setNotice(`Generated ${data.created_count} draft(s), skipped ${data.skipped_duplicates} duplicate(s).`);
      loadList();
    } catch (e) {
      setError(e.message);
    }
  }

  async function handleReview(id, action) {
    setError(""); setNotice("");
    try {
      const res = await fetch(`${API}/admin/questions/${id}/review`, {
        method: "POST", headers, body: JSON.stringify({ action }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Review failed.");
      setNotice(`${id} → ${data.status}.`);
      loadList();
    } catch (e) {
      setError(e.message);
    }
  }

  async function handleSeed() {
    setError(""); setNotice("");
    try {
      const res = await fetch(`${API}/admin/questions/seed`, { method: "POST", headers });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Seed failed.");
      setNotice(`Seed: ${data.imported} imported, ${data.skipped_duplicates} already present.`);
      loadList();
    } catch (e) {
      setError(e.message);
    }
  }

  return (
    <div>
      <PageHead eyebrow="Curation" title="Question bank" sub="Only active questions are served in interviews. Generated drafts need approval before they go live." />
      <div className="card">
        <ErrorBox message={error} />
        {notice && <div className="notice-box">{notice}</div>}
        <div className="admin-toolbar">
          <div>
            <label>Topic</label>
            <select value={filters.topic} onChange={(e) => setFilters({ ...filters, topic: e.target.value })}>
              <option value="">All topics</option>
              {meta.topics.map((t) => <option key={t} value={t}>{t}</option>)}
            </select>
          </div>
          <div>
            <label>Status</label>
            <select value={filters.status} onChange={(e) => setFilters({ ...filters, status: e.target.value })}>
              <option value="">All statuses</option>
              {meta.statuses.map((s) => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <div style={{ flex: 2 }}>
            <label>Search</label>
            <input type="text" value={filters.q} onChange={(e) => setFilters({ ...filters, q: e.target.value })} placeholder="Text or concept…" />
          </div>
          <div style={{ flex: "none" }}>
            <label>&nbsp;</label>
            <button className="btn secondary sm" style={{ marginTop: 0 }} onClick={loadList} disabled={loading}>
              {loading ? <Spinner /> : <React.Fragment><Icon name="refresh" size={14} /> Refresh ({total})</React.Fragment>}
            </button>
          </div>
        </div>
      </div>

      <div className="card flat">
        {items.length === 0 && !loading && <div className="muted">No questions match these filters.</div>}
        {items.map((it) => (
          <div key={it.id} className="q-row">
            <div>
              <span className="pill accent">{it.topic}</span>
              <span className="pill neutral">D{it.difficulty}</span>
              <span className={`pill status-pill ${it.status === "active" ? "success" : it.status === "rejected" || it.status === "archived" ? "danger" : "warning"}`}>{it.status.replace("_", " ")}</span>
              {it.domain && <span className="pill neutral">{it.domain}</span>}
              <span className="muted"> · {it.source} · {it.id}</span>
            </div>
            <div className="question-text" style={{ fontSize: 14.5, margin: "8px 0 4px" }}>{it.text}</div>
            {it.expected_concepts && it.expected_concepts.length > 0 && (
              <div className="muted" style={{ fontSize: 12.5 }}>Expects: {it.expected_concepts.join(", ")}</div>
            )}
            {it.review_note && <div className="muted" style={{ fontSize: 12.5 }}>Note: {it.review_note}</div>}
            <div className="row tight" style={{ marginTop: 10 }}>
              {(it.status === "draft" || it.status === "pending_review" || it.status === "rejected") && (
                <button className="icon-btn" onClick={() => handleReview(it.id, "approve")}><Icon name="check" size={14} /> Approve</button>
              )}
              {(it.status === "draft" || it.status === "pending_review") && (
                <button className="icon-btn" onClick={() => handleReview(it.id, "reject")}>Reject</button>
              )}
              {it.status === "active" && (
                <button className="icon-btn" onClick={() => { if (window.confirm("Archive this question? It will stop being served.")) handleReview(it.id, "archive"); }}>Archive</button>
              )}
            </div>
          </div>
        ))}
      </div>

      <details className="collapsible">
        <summary><Icon name="file" size={16} /> Create a question <span className="muted">— enters review as pending</span></summary>
        <div className="collapsible-body">
          <div className="field">
            <label>Topic</label>
            <select value={form.topic} onChange={(e) => setForm({ ...form, topic: e.target.value })}>
              <option value="">Select…</option>
              {meta.topics.map((t) => <option key={t} value={t}>{t}</option>)}
            </select>
          </div>
          <div className="field-row">
            <div className="field">
              <label>Difficulty (1–5)</label>
              <input type="text" value={form.difficulty} onChange={(e) => setForm({ ...form, difficulty: e.target.value })} />
            </div>
            <div className="field">
              <label>Domain (optional)</label>
              <select value={form.domain} onChange={(e) => setForm({ ...form, domain: e.target.value })}>
                <option value="">None</option>
                {meta.domains.map((d) => <option key={d} value={d}>{d}</option>)}
              </select>
            </div>
          </div>
          <div className="field">
            <label>Question text</label>
            <textarea value={form.text} onChange={(e) => setForm({ ...form, text: e.target.value })} placeholder="Write a clear, single interview question…" />
          </div>
          <div className="field">
            <label>Expected concepts (comma-separated)</label>
            <input type="text" value={form.expected_concepts} onChange={(e) => setForm({ ...form, expected_concepts: e.target.value })} />
          </div>
          <button className="btn primary" onClick={handleCreate}>Create for review</button>
        </div>
      </details>

      <details className="collapsible">
        <summary><Icon name="refresh" size={16} /> Generate with AI <span className="muted">— always lands as drafts, never auto-published</span></summary>
        <div className="collapsible-body">
          <div className="field-row">
            <div className="field">
              <label>Domain</label>
              <select value={gen.domain} onChange={(e) => setGen({ ...gen, domain: e.target.value })}>
                <option value="">None</option>
                {meta.domains.map((d) => <option key={d} value={d}>{d}</option>)}
              </select>
            </div>
            <div className="field">
              <label>Topic</label>
              <select value={gen.topic} onChange={(e) => setGen({ ...gen, topic: e.target.value })}>
                <option value="">Auto (domain)</option>
                {meta.topics.map((t) => <option key={t} value={t}>{t}</option>)}
              </select>
            </div>
            <div className="field">
              <label>Difficulty</label>
              <input type="text" value={gen.difficulty} onChange={(e) => setGen({ ...gen, difficulty: e.target.value })} />
            </div>
            <div className="field">
              <label>Count (1–10)</label>
              <input type="text" value={gen.count} onChange={(e) => setGen({ ...gen, count: e.target.value })} />
            </div>
          </div>
          <div className="field">
            <label>Extra context (optional)</label>
            <input type="text" value={gen.context} onChange={(e) => setGen({ ...gen, context: e.target.value })} placeholder="e.g. focus on triage scenarios for ICU nurses" />
          </div>
          <button className="btn primary" onClick={handleGenerate}>Generate drafts</button>
        </div>
      </details>

      <div className="card flat">
        <div className="row" style={{ alignItems: "center" }}>
          <div style={{ flex: 1 }}>
            <h2 style={{ margin: 0 }}>Static bank import</h2>
            <p className="card-sub" style={{ margin: "4px 0 0" }}>One-time migration of the built-in question list. Safe to re-run — duplicates are skipped.</p>
          </div>
          <button className="btn secondary sm" style={{ marginTop: 0 }} onClick={handleSeed}>Seed static bank</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [session, setSession] = useState(null);
  // Start logged out: the stored token is only trusted after /me validates it.
  const [user, setUser] = useState(null);
  const [screen, setScreen] = useState("landing"); // landing | login | upload | qa | coding | report | admin

  useEffect(() => {
    const token = localStorage.getItem("intervexa_token");
    if (!token) return;
    fetch(`${API}/me`, { headers: { "Authorization": `Bearer ${token}` } })
      .then((res) => {
        if (!res.ok) throw new Error("invalid token");
        return res.json();
      })
      .then((data) => {
        const name = data.name || localStorage.getItem("intervexa_name") || "Account";
        localStorage.setItem("intervexa_name", name);
        setUser({ token, name, email: data.email });
        setScreen((s) => (s === "landing" || s === "login" ? "upload" : s));
      })
      .catch(() => {
        localStorage.removeItem("intervexa_token");
        localStorage.removeItem("intervexa_name");
        setUser(null);
      });
  }, []);

  function handleLogout() {
    localStorage.removeItem("intervexa_token");
    localStorage.removeItem("intervexa_name");
    setUser(null);
    setSession(null);
    setScreen("landing");
  }

  const initial = (user && user.name ? user.name : "U").trim().charAt(0).toUpperCase();
  const inFlow = user && ["upload", "qa", "coding", "report"].includes(screen);

  return (
    <div>
      {screen !== "landing" && (
        <header className="navbar">
          <div className="navbar-inner">
            <div className="brand"><span className="brand-mark">Ix</span>Intervexa</div>
            {inFlow && (
              <nav className="nav-links">
                <button className={`nav-link ${["upload", "qa", "coding"].includes(screen) ? "active" : ""}`} onClick={async () => {
                  if (screen === "coding") {
                    try {
                      await fetch(`${API}/set-round`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                          session_id: session.sessionId,
                          candidate_id: session.candidateId,
                          round_name: "hr",
                        }),
                      });
                    } catch (_) {}
                    setSession((s) => s ? { ...s, currentRound: "hr" } : s);
                    setScreen("qa");
                  } else if (screen === "qa") {
                    // already here, no-op
                  } else {
                    setScreen("upload");
                  }
                }}>Interview</button>
                <button className={`nav-link ${screen === "report" ? "active" : ""}`} onClick={() => { if (session) setScreen("report"); }}>Report</button>
                <button className="nav-link" onClick={() => setScreen("admin")}>Curation</button>
              </nav>
            )}
            {user && screen === "admin" && (
              <nav className="nav-links">
                <button className="nav-link" onClick={() => setScreen("upload")}>Interview</button>
                <button className="nav-link active" onClick={() => {}}>Curation</button>
              </nav>
            )}
            <div className="nav-spacer" />
            {user && (
              <div className="user-chip">
                <span className="avatar">{initial}</span>
                <span>{user.name}</span>
                <button className="btn ghost sm" onClick={handleLogout} title="Log out"><Icon name="logout" size={14} /> Log out</button>
              </div>
            )}
          </div>
        </header>
      )}
      <div className="app">

      {screen === "landing" && (
        <LandingScreen onGetStarted={() => setScreen("login")} />
      )}

      {screen === "login" && (
        <LoginScreen onAuthenticated={(u) => { setUser(u); setScreen("upload"); }} />
      )}

      {screen === "upload" && (
        <UploadScreen
          onStarted={(s) => { setSession(s); setScreen("qa"); }}
        />
      )}

      {screen !== "upload" && session && session.profile && screen === "qa" && (
        <ProfileSummary profile={session.profile} />
      )}

      {screen === "qa" && session && (
        <InterviewScreen
          session={session}
          onUpdate={setSession}
          onDone={() => setScreen("report")}
          onGoToCoding={() => {
            setSession({ ...session, currentRound: "coding", domainComplete: false });
            setScreen("coding");
          }}
        />
      )}

      {screen === "coding" && session && (
        <CodingScreen
          session={session}
          onBackToQA={(round) => {
            setSession({ ...session, currentRound: round || "domain", domainComplete: false });
            setScreen("qa");
          }}
          onGoToHR={async () => {
            try {
              await fetch(`${API}/set-round`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  session_id: session.sessionId,
                  candidate_id: session.candidateId,
                  round_name: "hr",
                }),
              });
            } catch (_) {}
            setSession({ ...session, currentRound: "hr" });
            setScreen("qa");
          }}
          onDone={() => setScreen("report")}
        />
      )}

      {screen === "report" && session && (
        <ReportScreen session={session} onRestart={() => { setSession(null); setScreen("upload"); }} />
      )}

      {screen === "admin" && user && (
        <AdminScreen onBack={() => setScreen("upload")} />
      )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
